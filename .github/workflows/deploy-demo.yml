# Publishes the browser demonstration to GitHub Pages.
#
# One-time setup: in the repository, open Settings → Pages and set
# "Source" to "GitHub Actions". Then push to main.
#
# The base path comes from the repository name automatically, so this works
# whatever the repository is called.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only the web workspace is installed. The server depends on
      # better-sqlite3, which compiles native code the static build never needs.
      - name: Install web dependencies
        run: npm ci --workspace web --include-workspace-root

      - name: Build the demo
        run: npm run build:demo
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/

      # Stops GitHub Pages running the output through Jekyll, which would
      # discard the assets directory.
      - name: Add .nojekyll
        run: touch web/dist/.nojekyll

      # A Pages deployment whose root has no index.html publishes a 404 and
      # still reports success. Fail here instead, where the cause is visible.
      - name: Check the build produced a site
        run: |
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing - the demo build produced no site."
            ls -la web/dist || echo "web/dist does not exist"
            exit 1
          fi
          echo "Publishing these files:"
          ls -la web/dist
          echo "Asset references:"
          grep -o 'src="[^"]*"' web/dist/index.html || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
